name: Update Google Scholar Stats

# Cloud fetching failed in the verified runner environment. Daily publishing is
# handled by the owner's local Codex task at 08:30 Asia/Shanghai. Keep this
# workflow available for explicit cloud diagnostics without daily failed runs.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check parser and failure handling
        run: python -m unittest discover -s google_scholar_crawler -p 'test_*.py'

      - name: Fetch and validate public Scholar metrics
        run: python google_scholar_crawler/main.py

      # This step runs only after a successful fetch. The data branch is served
      # directly as JSON; no homepage rebuild or visitor-side Scholar request.
      - name: Publish successful snapshot
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./google_scholar_crawler/results
          publish_branch: google-scholar-stats
          commit_message: "chore: update verified Google Scholar stats"
